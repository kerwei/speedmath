# QuickMath Nginx 配置 (pèizhì — configuration)
# Reverse proxy: port 443 (HTTPS) → 127.0.0.1:8080
# Port 80 redirects to HTTPS
# Domain: quickmath.games

upstream quickmath_backend {
    server 127.0.0.1:8080;
}

server {
    listen 80;
    server_name quickmath.games;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name quickmath.games;

    # SSL (自签名回退 zì qiānmíng huí tuì — self-signed fallback)
    # When certbot is run, it replaces these paths with Let's Encrypt certs.
    ssl_certificate     /etc/nginx/ssl/quickmath.games.crt;
    ssl_certificate_key /etc/nginx/ssl/quickmath.games.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Logs
    access_log /var/log/nginx/quickmath-access.log;
    error_log  /var/log/nginx/quickmath-error.log;

    # ── API & WebSocket ──
    location /api/ws {
        proxy_pass http://quickmath_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://quickmath_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Static files (served by backend, proxied through nginx) ──
    location / {
        proxy_pass http://quickmath_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
